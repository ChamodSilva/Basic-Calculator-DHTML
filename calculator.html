<!DOCTYPE html>
<html>
    <head>
        <!-- Metadata -->
        <meta charset="UTF-8">
        <meta name="description" content="Basic Calculator for simple calculations">
        <meta name="keywords" content="HTML, DHTML, Basic Calculator, Institute of Data, Lab 4">
        <meta name="author" content="Chamod Silva">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Website Infor -->
        <title>Basic Calculator</title>

        <!-- Reference links for styling -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inria+Sans:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="calculator.css">
    </head>
    <body>
        <h1>Basic Calculator</h1>
        <div class="calculator">
            <input type="text" name="calculator-display" id="display" disabled>
            <div class="buttons">
                <button class="number">7</button>
                <button class="number">8</button>
                <button class="number">9</button>
                <button class="command" Id="clear">C</button>

                <button class="number">4</button>
                <button class="number">5</button>
                <button class="number">6</button>
                <button class="operator">/</button>

                <button class="number">1</button>
                <button class="number">2</button>
                <button class="number">3</button>
                <button class="operator">x</button>

                <button class="number">0</button>
                <button class="number">+</button>
                <button class="operator">-</button>
                <button class="command" id="equals">=</button>
            </div>
        </div>
        <script src="/calculator.js"></script>
    </body>
</html>
